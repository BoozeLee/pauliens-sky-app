app-id: com.pauliensky.PauliensSky
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: pauliens_sky

finish-args:
  - --share=network
  - --filesystem=home
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --talk-name=org.freedesktop.portal.Desktop

modules:
  - name: pauliens-sky
    buildsystem: simple
    build-commands:
      - install -Dm755 pauliens_sky /app/bin/pauliens_sky
      - cp -r lib/ /app/lib/
      - install -Dm644 com.pauliensky.PauliensSky.desktop
          /app/share/applications/com.pauliensky.PauliensSky.desktop
      - install -Dm644 icons/512x512/pauliens-sky.png
          /app/share/icons/hicolor/512x512/apps/com.pauliensky.PauliensSky.png
    sources:
      - type: dir
        path: ../build/linux/x64/release/bundle
